plugins { id 'com.android.application' }

android {
    namespace 'io.github.jiangxixu.shiguang'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.jiangxixu.shiguang'
        minSdk 26
        targetSdk 35
        versionCode 181
        versionName '1.6.21'
        buildConfigField 'String', 'WEB_URL', '"https://jiangxixu.github.io/shiguang/"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def signingFile = System.getenv('ANDROID_KEYSTORE_PATH')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'shiguang'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    sourceSets { main { assets.srcDirs = ['../../dist'] } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
