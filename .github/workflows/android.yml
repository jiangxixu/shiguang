name: Build and publish Android
on:
  push:
    branches: [main]
    paths: ['android/**', 'collector/**', 'dist/**', 'test/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate web app and collectors
        run: |
          node --test test/*.test.cjs
          node --check dist/app.js
          node --check collector/background.js
          node --check collector/library-bridge.js
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check overlay drag and docking geometry
        run: |
          javac -d "$RUNNER_TEMP/overlay-test" android/app/src/main/java/io/github/jiangxixu/shiguang/OverlayGeometry.java test/OverlayGeometryTest.java
          java -cp "$RUNNER_TEMP/overlay-test" io.github.jiangxixu.shiguang.OverlayGeometryTest
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Install Android build components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shiguang.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/shiguang.p12"
          gradle -p android --no-daemon assembleRelease
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/shiguang-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/shiguang-android.apk
          cp dist/collector.zip release/shiguang-collector.zip
          cd release && sha256sum shiguang-android.apk shiguang-collector.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: release/
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: release
      - name: Publish signed APK to GitHub Releases
        run: node scripts/publish-release.cjs
        env:
          GH_TOKEN: ${{ github.token }}
