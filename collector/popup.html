<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>拾光采集</title><h1>拾光 <small>收藏采集</small></h1><p>在原平台登录并打开收藏页，滚动加载需要的内容，再点击采集。只能读取当前已加载的链接，不会自动获取完整收藏。</p><div class="actions"><button id="scan">采集当前页面</button><button id="page">仅保存此网页</button></div><p id="status" role="status"></p><div id="tools" hidden><label><input id="all" type="checkbox" checked> 全选 / 取消</label></div><div id="results"></div><button id="export" disabled>导出选中的 JSON</button><p class="foot">导出后回到拾光 → 导入与采集 → 导入文件。页面链接需要人工检查，标题缺失时可回到拾光修改。扩展不读取密码或 Cookie。</p><script src="popup.js"></script></html>
