<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏到拾光</title><link rel="stylesheet" href="capture.css"></head>
<body><main><header><span class="mark">拾</span><div><small>留住此刻的好奇</small><h1>收藏到拾光</h1></div><button id="cancel" aria-label="取消收藏">×</button></header>
<section class="source"><strong id="title">正在读取网页…</strong><p id="url"></p></section>
<form id="capture-form"><label for="tags">分类 / 标签 <span>选填</span></label><input id="tags" maxlength="1200" placeholder="例如：机器人，编程，稍后学习" autocomplete="off" list="categories"><datalist id="categories"></datalist><p class="hint">可以填写多个分类，用逗号分隔；留空也能收藏。</p>
<label for="reason">为什么收藏它 <span>选填</span></label><textarea id="reason" maxlength="15000" rows="4" placeholder="想学什么？准备什么时候用到？"></textarea>
<details id="excerpt" hidden><summary>同时保存选中文字</summary><p id="selection"></p></details>
<p id="status" role="status" aria-live="polite"></p><button class="save" id="save" type="submit" disabled>保存收藏 <span>↗</span></button><p class="footer">按 Ctrl + Enter 保存 · Esc 取消</p></form></main><script src="capture.js"></script></body></html>
